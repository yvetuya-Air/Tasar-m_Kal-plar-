{% extends 'base.html' %}
{% block title %}Parolayı Değiştir{% endblock %}
{% block content %}
<section class="panel book-editor"><h1>Parolayı Değiştir</h1>
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="book-form" action="{{ url_for('member_portal.password') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field full"><label for="current_password">Mevcut parola</label><input id="current_password" type="password" name="current_password" autocomplete="current-password" maxlength="256" required></div>
<div class="field"><label for="new_password">Yeni parola</label><input id="new_password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
<div class="field"><label for="confirmation">Yeni parola tekrar</label><input id="confirmation" type="password" name="confirmation" autocomplete="new-password" minlength="8" maxlength="256" required></div>
<div class="form-actions full"><button type="submit" class="button">Parolayı değiştir</button></div></form></section>
{% endblock %}
