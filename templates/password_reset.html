{% extends 'base.html' %}
{% block title %}Parolayı Sıfırla{% endblock %}
{% block content %}
<section class="panel book-editor"><h1>Parolayı Sıfırla</h1>
<p>Yönetici kimliğinizi doğruladıktan sonra size verilen tek kullanımlık kodu girin.</p>
{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
<form class="book-form" method="post" action="{{ url_for('auth.reset') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field full"><label for="token">Sıfırlama kodu</label><input id="token" name="token" type="password" autocomplete="one-time-code" maxlength="43" required></div>
  <div class="field"><label for="password">Yeni parola</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
  <div class="field"><label for="confirmation">Parolayı doğrula</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
  <div class="form-actions full"><button type="submit" class="button">Parolayı sıfırla</button><a href="{{ url_for('auth.login') }}">Girişe dön</a></div>
</form></section>
{% endblock %}
