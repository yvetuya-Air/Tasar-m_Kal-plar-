{% extends 'base.html' %}
{% block title %}Kategoriler{% endblock %}
{% block content %}
<div class="page-heading"><h1>Kategoriler</h1></div>
<section class="panel">
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('categories.index') }}" class="search-form">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <label for="new-category">Yeni kategori</label><div class="search-controls"><input id="new-category" name="name" maxlength="100" required><button class="button" name="operation" value="add">Ekle</button></div>
</form>
{% for category in categories %}
<form method="post" action="{{ url_for('categories.index') }}" class="search-form">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="category_id" value="{{ category.id }}">
 <label for="category-{{ category.id }}">Kategori adı</label>
 <div class="search-controls"><input id="category-{{ category.id }}" name="name" maxlength="100" value="{{ category.name }}" required>
 <button class="button secondary-button" name="operation" value="rename">Kaydet</button><button class="button danger-button" name="operation" value="delete" data-confirm="Bu kategori silinsin mi?" formnovalidate>Sil</button></div>
</form>
{% endfor %}
</section>
{% endblock %}
